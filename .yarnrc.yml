nodeLinker: node-modules

# Link workspaces only through the workspace: protocol, so pinned previous releases
# such as bcrypt-previous (npm:@node-rs/bcrypt@1.10.9) come from the registry even
# when a workspace currently has the same version.
enableTransparentWorkspaces: false

npmRegistryServer: 'https://registry.npmjs.org/'

yarnPath: .yarn/releases/yarn-4.18.1.cjs

npmPreapprovedPackages:
  # This repo's own packages, including previous releases pinned by compatibility tests.
  - '@node-rs/*'
  - '@napi-rs/*'
  - oxlint
  - '@oxlint/*'
  - oxfmt
  - '@oxfmt/*'
  - oxc-parser
  - '@oxc-parser/*'
  - '@oxc-project/*'
  - emnapi
  - '@emnapi/*'
  - '@tybys/wasm-util'
